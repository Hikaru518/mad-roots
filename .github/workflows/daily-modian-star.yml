name: Daily Modian Star

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MODIAN_URL: https://m.modian.com/idea/2951.html
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automations/modian_daily/requirements.txt

      - name: Install dependencies
        run: >-
          python -m pip install
          --requirement automations/modian_daily/requirements.txt

      - name: Run unit tests
        run: >-
          python -m unittest discover
          --start-directory automations/modian_daily/tests
          --verbose

      - name: Scrape Modian and write to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python -m automations.modian_daily.main

name: Daily Modian Star

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MODIAN_URL: https://m.modian.com/idea/2951.html
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automations/modian_daily/requirements.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: >-
          .venv/bin/python -m pip install
          --requirement automations/modian_daily/requirements.txt

      - name: Run unit tests
        run: >-
          .venv/bin/python -m unittest discover
          --start-directory automations/modian_daily/tests
          --verbose

      - name: Scrape Modian idea and write to its Notion database
        id: idea
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: .venv/bin/python -m automations.modian_daily.main

      - name: Scrape Modian crowdfunding and write to its Notion database
        id: crowdfunding
        continue-on-error: true
        env:
          MODIAN_CROWDFUNDING_URL: https://zhongchou.modian.com/item/159828
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CROWDFUNDING_DATABASE_ID: >-
            ${{ secrets.NOTION_CROWDFUNDING_DATABASE_ID }}
        run: .venv/bin/python -m automations.modian_daily.crowdfunding_main

      - name: Verify both Modian automations succeeded
        if: ${{ always() }}
        env:
          IDEA_OUTCOME: ${{ steps.idea.outcome }}
          CROWDFUNDING_OUTCOME: ${{ steps.crowdfunding.outcome }}
        run: |
          if [[ "$IDEA_OUTCOME" != "success" || "$CROWDFUNDING_OUTCOME" != "success" ]]; then
            echo "Idea outcome: $IDEA_OUTCOME"
            echo "Crowdfunding outcome: $CROWDFUNDING_OUTCOME"
            exit 1
          fi
